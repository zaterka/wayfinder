[workspace]
members = ["crates/wayfinder-core", "crates/wayfinder"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pedro-zaterka/wayfinder"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
